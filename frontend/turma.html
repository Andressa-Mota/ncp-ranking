<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Turma - NCP</title>
    <link rel="icon" type="image/jpeg" href="images/ncp.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="turma-body">
    
    <div class="decoration-box top-deco"><div class="deco-inner"></div></div>
    
    <header class="ranking-header">
        <div class="header-left" style="display: flex; align-items: center;">
            <button class="voltar-btn" id="turma-voltar-btn" onclick="handleTurmaVoltar()">
                <div class="voltar-icon-container" id="turma-voltar-container">
                    <span class="voltar-arrow">◀</span>
                    <span id="turma-voltar-text">VOLTAR</span>
                </div>
            </button>
            <h2 id="turma-title" class="turma-title-blue">CARREGANDO...</h2>
        </div>
        
        <script>
            function handleTurmaVoltar() {
                if (localStorage.getItem('userType') === 'aluno') {
                    localStorage.clear();
                    window.location.href = 'index.html';
                } else {
                    window.location.href = 'menu.html';
                }
            }
            document.addEventListener("DOMContentLoaded", () => {
                if (localStorage.getItem('userType') === 'aluno') {
                    document.getElementById('turma-voltar-text').innerText = 'SAIR';
                    document.getElementById('turma-voltar-container').style.borderColor = '#ff4c4c';
                    document.getElementById('turma-voltar-container').style.color = '#ff4c4c';
                }
            });
        </script>
        
        <div class="header-center">
            <h1 class="header-title">RANKING PARA DESTAQUES DO MÊS</h1>
        </div>
        
        <div class="header-right" id="header-right-actions" style="display: flex; align-items: center; gap: 20px;">
            <div class="simple-logo">
                <span class="sl-top">NCP</span>
                <span class="sl-bot">CURSOS</span>
            </div>
        </div>
    </header>

    <!-- Poster Rumo ao Dia da Pizza (Turmas criadas por Andressa ou Lucas) -->
    <div id="andressa-poster-container" class="andressa-poster-container" style="display: none;">
        <div class="andressa-poster-content">
            <div class="poster-side-group left-group">
                <svg class="pizza-svg slice-left" viewBox="0 0 100 100" fill="none">
                    <path d="M15 20 Q50 5 85 20 C85 20 80 30 78 32 Q50 18 22 32 Z" fill="#e89d4f" stroke="#8c4b18" stroke-width="2"/>
                    <path d="M20 30 Q50 17 80 30 L50 90 Z" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
                    <path d="M22 30 Q50 18 78 30" stroke="#dc2626" stroke-width="3" fill="none"/>
                    <circle cx="40" cy="42" r="7" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
                    <circle cx="60" cy="45" r="6.5" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
                    <circle cx="50" cy="62" r="6" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
                    <circle cx="38" cy="40" r="1" fill="#fca5a5"/>
                    <circle cx="42" cy="44" r="1" fill="#fca5a5"/>
                    <circle cx="59" cy="43" r="1" fill="#fca5a5"/>
                    <circle cx="49" cy="60" r="1" fill="#fca5a5"/>
                </svg>
                <div class="pepperoni-cluster">
                    <span class="pep-dot pep-1"></span>
                    <span class="pep-dot pep-2"></span>
                    <span class="pep-dot pep-3"></span>
                    <span class="pep-dot pep-4"></span>
                </div>
            </div>

            <h2 class="poster-title">RUMO AO DIA DA PIZZA</h2>

            <div class="poster-side-group right-group">
                <div class="pepperoni-cluster">
                    <span class="pep-dot pep-1"></span>
                    <span class="pep-dot pep-2"></span>
                    <span class="pep-dot pep-3"></span>
                    <span class="pep-dot pep-4"></span>
                </div>
                <svg class="pizza-svg slice-right" viewBox="0 0 100 100" fill="none">
                    <path d="M15 20 Q50 5 85 20 C85 20 80 30 78 32 Q50 18 22 32 Z" fill="#e89d4f" stroke="#8c4b18" stroke-width="2"/>
                    <path d="M20 30 Q50 17 80 30 L50 90 Z" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
                    <path d="M22 30 Q50 18 78 30" stroke="#dc2626" stroke-width="3" fill="none"/>
                    <circle cx="40" cy="42" r="7" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
                    <circle cx="60" cy="45" r="6.5" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
                    <circle cx="50" cy="62" r="6" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
                    <circle cx="38" cy="40" r="1" fill="#fca5a5"/>
                    <circle cx="42" cy="44" r="1" fill="#fca5a5"/>
                    <circle cx="59" cy="43" r="1" fill="#fca5a5"/>
                    <circle cx="49" cy="60" r="1" fill="#fca5a5"/>
                </svg>
            </div>
        </div>
    </div>

    <main class="ranking-grid" id="ranking-grid">
        <!-- Javascript vai injetar os cartões de alunos aqui -->
    </main>

    <!-- Seção de Estatísticas da Turma (XP Total e Média) -->
    <section class="turma-stats-section" id="turma-stats-section">
        <div class="turma-stats-card">
            <div class="turma-xp-header">
                <span class="turma-xp-title">XP TOTAL DA TURMA</span>
                <span class="turma-xp-value" id="turma-total-xp-val">0 XP</span>
            </div>
            <div class="turma-xp-bar-container">
                <div class="turma-xp-fill" id="turma-xp-fill" style="width: 0%;"></div>
            </div>
            <div class="turma-media-row">
                <span class="turma-media-label">MÉDIA DE XP DA TURMA:</span>
                <span class="turma-media-value" id="turma-media-xp-val">0 XP</span>
            </div>
        </div>
    </section>

    <div class="decoration-box bot-deco"><div class="deco-inner"></div></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('id');
            if (slug && typeof loadClassRanking === "function") {
                loadClassRanking(slug);
            } else {
                document.getElementById('turma-title').innerText = "TURMA NÃO IDENTIFICADA";
            }
        });
    </script>
</body>
</html>
